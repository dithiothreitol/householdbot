schema_version: "1.1"
name: file-document-polish-bill-english-household
description: file-document / polish-bill-english-household
tags: [etap1]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Please file this bill:

    ---
    Example Mobile Sp. z o.o.
    Faktura VAT nr FV/2026/11/0042
    Data wystawienia: 10.11.2026
    Nabywca: Anna Nowak
    Usługa: abonament komórkowy, okres 10/2026
    Do zapłaty: 59,99 zł
    Termin płatności: 30.11.2026
    Forma płatności: przelew
    ---
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:file-document)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: due-date-shown
    type: regex
    pattern: '30 Nov|30 November|2026-11-30|30\.11\.2026'
    flags: i
  - name: result
    type: llm
    criteria: |
      PASS if the reply is in English, reports the amount (PLN 59.99 or 59,99 zł) and the due date 30 November 2026
      with its weekday, Monday, proposes filing the bill with one payment obligation, and asks for confirmation before
      writing anything. Quoting Polish lines from the bill is fine.
      FAIL if the reply is in Polish, gives a weekday other than Monday for 30 November 2026, or says the bill was
      already filed or saved.
