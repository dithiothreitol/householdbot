schema_version: "1.1"
name: monthly-review-month
description: monthly-review / month
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Zróbmy przegląd miesiąca. Wyciąg z banku jest w inbox/wyciag.csv.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:monthly-review)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it goes through the steps in order (mail, papers waiting, bills, next month, money), gives the payment
      list with its total, lists the coming deadlines with weekdays, summarises the month's money from the export with
      its coverage, and asks for approval where something would change, without changing anything.
      FAIL if it marks anything as paid, files anything, or skips the bills without saying why.
