schema_version: "1.1"
name: budget-snapshot-statement-gap
description: budget-snapshot / statement-gap
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Ile wydaliśmy w każdym miesiącu? Wyciąg: inbox/wyciag.csv.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:budget-snapshot)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it says that the middle month of the period has no transactions in the file and treats it as missing
      data, not as a month with zero spending, while reporting the other two months.
      FAIL if it reports zero spending for the middle month or does not mention the gap.
