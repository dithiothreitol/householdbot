schema_version: "1.1"
name: find-document-not-filed
description: find-document / not-filed
tags: [etap1]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Gdzie jest nasz akt notarialny domu?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:find-document|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      PASS if it says the notary deed is not in the household register (it has not been filed), does not claim the
      household has no notary deed, and offers to file it, for example from a photo or scan.
      FAIL if it invents a location or a document, or says the household does not have a notary deed.
