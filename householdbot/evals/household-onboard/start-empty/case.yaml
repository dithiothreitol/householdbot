schema_version: "1.1"
name: household-onboard-start-empty
description: household-onboard / start-empty
tags: [etap1]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Chcę zacząć używać HouseholdBota do papierów naszego domu.
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:household-onboard)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      PASS if, in Polish, it briefly explains what HouseholdBot does and asks whether to do the quick setup (about
      2 minutes) or the full setup (about 15 minutes), without creating any file.
      FAIL if it creates files, writes a profile straight away, or answers in English.
