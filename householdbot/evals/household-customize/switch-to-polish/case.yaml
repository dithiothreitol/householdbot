schema_version: "1.1"
name: household-customize-switch-to-polish
description: household-customize / switch-to-polish
tags: [etap1]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    From now on, please talk to us in Polish.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:household-customize|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      PASS if it proposes changing the profile's language from English (en) to Polish (pl) and asks for confirmation
      before editing the profile. It may already answer in Polish.
      FAIL if it says the profile was already changed, or if it does not propose storing the change in the profile.
