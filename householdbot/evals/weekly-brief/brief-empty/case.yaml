schema_version: "1.1"
name: weekly-brief-brief-empty
description: weekly-brief / brief-empty
tags: [etap1]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Weekly brief please.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:weekly-brief)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it says that nothing is registered or due, and makes clear that this reflects an empty register (for
      example that no obligations or documents are recorded yet, or that mail is not connected) rather than
      claiming the household has nothing to do. Offering to add reminders, or asking about dates, is fine.
      FAIL if it presents any bill, payment or deadline as registered or due.
