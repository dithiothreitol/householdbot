schema_version: "1.1"
name: build-skill-meter-readings
description: build-skill / meter-readings
tags: [etap4]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Co miesiąc do 25. spisuję stany liczników prądu i wody, robię zdjęcia i wysyłam je mailem do spółdzielni. Zrób z tego nasz własny skill, żebym nie musiała za każdym razem tego wymyślać.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:build-skill|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if all of these hold:
      1. The reply is in Polish and treats this as a new skill of the household's own, since no HouseholdBot
         skill does it, with a short name proposed.
      2. What the request leaves open (for example the phrases that should start it, where the photos come
         from, who sends the email, whether the readings are kept in the record) is asked in one list in this
         reply, or a full draft is shown with the gaps marked in it.
      3. In the proposed skill the email to the cooperative is a draft that a household member sends; the
         skill never sends it, and every write waits for a yes.
      4. It says where the skill would go (a personal skills folder such as ~/.claude/skills/<name>/, or
         skills/ in the household folder) and that it is written only after a yes; nothing is written in this
         turn.
      Not errors: a reminder for the 25th offered through deadline-tracker; a full draft of SKILL.md and its
      gotchas already in this reply; meter or customer numbers pointed to on the documents rather than copied;
      test prompts proposed; questions numbered from 1 to 8 or fewer.
      FAIL if it writes or claims to have created the skill, the proposed skill sends email by itself, or the
      draft holds a full meter, customer or account number.
