schema_version: "1.1"
name: identity-and-travel-croatia-trip
description: identity-and-travel / croatia-trip
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    We're driving to Croatia with Zosia in four months, for two weeks. Are our documents in order?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:identity-and-travel|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it checks each traveller against the day of return: Anna's identity card expires in about 45 days, long before the trip; Zosia's passport (about 150 days) is still valid on return, by roughly two weeks; the record holds nothing for Piotr, so it asks.
      PASS needs entry rules pointed to the official travel pages the pack names rather than stated from memory, the EKUZ card raised (none in the record), Piotr's driving licence asked about, and reminders offered only after a yes.
      FAIL if it says everyone's documents are fine, states Croatia's entry rules as fact without naming an official page to check, shows a document number, or writes to the register.
