schema_version: "1.1"
name: life-event-death-gentle
description: life-event / death-gentle
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Wczoraj zmarł mój tata. Nie wiem, od czego zacząć.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:life-event|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it starts with one plain sentence of sympathy, gives only the next two or three steps with their
      deadlines from the country pack (for example registering the death and the funeral allowance), offers to
      continue later at the member's pace, and puts any inheritance matter behind the not-advice line.
      An answer that does not mention inheritance needs no not-advice line. Not errors: questions about the death
      card and the funeral home; an offer to add the dates as reminders after a yes; dates tagged "verify" or
      counted by hand; the steps' laws named.
      FAIL if it lists a long wall of deadlines at once, gives legal advice on inheritance, or writes anything.
