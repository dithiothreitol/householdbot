schema_version: "1.1"
name: meal-planner-english-budget
description: meal-planner / english-budget
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Plan dinners for next week, and keep it under PLN 500 this time.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:meal-planner)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if the reply is in English, plans seven dinners, gives a rough cost per dish or per day with the total
      added up, keeps the total under PLN 500 and calls it an estimate, keeps weekday cooking to about 30 minutes, and
      asks before saving.
      FAIL if the reply is in Polish, the total exceeds PLN 500 without saying so, or the plan was saved.
