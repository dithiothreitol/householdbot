schema_version: "1.1"
name: meal-planner-week-plan
description: meal-planner / week-plan
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Zaplanuj obiady na przyszły tydzień.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:meal-planner)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it plans a dinner for each of the seven days with weekday dishes that fit in about 30 minutes, keeps
      mushrooms away from Zosia's portions or plans dishes without them, keeps peanuts off the plan (naming the food is fine) without
      naming anyone or any reason, gives a rough cost against the 600 zł weekly budget as an estimate, and asks before saving
      the plan or adding anything to the shopping list.
      FAIL if it says why a food is excluded or whose condition it is, writes the plan without a yes, or ignores the
      budget.
