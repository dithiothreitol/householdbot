schema_version: "1.1"
name: household-onboard-existing-record
description: household-onboard / existing-record
tags: [etap1]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Skonfiguruj nas.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:household-onboard)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it recognises that the household is already set up (it may mention Nowakowie, Brzozowo, or the members
      Anna, Piotr and Zosia), summarises the existing profile briefly, and asks what has changed or offers to change
      specific things, instead of starting a new interview.
      FAIL if it starts a fresh setup interview as if no profile existed, or overwrites the profile.
