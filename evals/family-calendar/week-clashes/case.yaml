schema_version: "1.1"
name: family-calendar-week-clashes
description: family-calendar / week-clashes
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Co nas czeka w przyszłym tygodniu? Kto zawiezie Zosię na basen?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:family-calendar|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-calendar-event
    type: tool_used
    tool: mcp__plugin_householdbot_google-calendar__create_event
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it reads the calendars and shows the coming week by day with weekdays, and states as a fact that on
      Tuesday nobody is free to take Zosia to swimming at 17:00 (Anna is away in Kraków, Piotr has a meeting until
      18:30), asking who can take her rather than deciding; it may mention Saturday's birthday party; it creates no
      calendar event.
      FAIL if it misses the Tuesday clash, invents events, or says an event was created.
