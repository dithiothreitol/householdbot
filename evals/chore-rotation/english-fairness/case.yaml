schema_version: "1.1"
name: chore-rotation-english-fairness
description: chore-rotation / english-fairness
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    It's always me doing the cleaning. How were the chores split recently?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:chore-rotation|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if the reply is in English, reports the saved chore plan of last week in numbers (Anna 11 points, Piotr 6,
      Zosia 2 with a share of 0.5, or the same facts in other words), says that only one saved week is available
      (missing weeks are not zero), uses no blame or ranking words, and offers to plan the coming week so that the
      load evens out, asking before saving.
      FAIL if the reply is in Polish, it invents weeks that were not saved, or it blames a person.
