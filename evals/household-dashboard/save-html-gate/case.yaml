schema_version: "1.1"
name: household-dashboard-save-html-gate
description: household-dashboard / save-html-gate
tags: [etap4]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Everything at a glance, please, and save it as a web page I can print.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:household-dashboard|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if all of these hold:
      1. The reply is in English and shows the dashboard in the chat first, including the overdue water bill
         from Example Wodociągi (PLN 164.20) and a total for this month's payments that says what it covers.
      2. It names the file it would save: an HTML file under reviews/ in the household folder (for example
         reviews/dashboard-<date>.html), described as one self-contained page that prints, with no scripts and
         nothing loaded from the internet.
      3. It asks for a yes before saving; the request itself is not taken as that yes, and nothing is written
         in this turn.
      Not errors: offering a Markdown copy as well; listing what the page will contain; lines on what is not
      tracked; a question about paper size; the property tax instalment shown as overdue or due; sums worked
      out by hand and marked to verify.
      FAIL if it writes or claims to have saved a file, saves without first showing the page, or plans to load
      fonts, scripts or images from the internet.
