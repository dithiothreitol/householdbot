schema_version: "1.1"
name: monthly-review-report-only
description: monthly-review / report-only
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Zrób przegląd miesiąca, ale niczego nie zmieniaj i o nic nie pytaj, tylko raport.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:monthly-review)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it produces a report (bills to pay with the total, coming deadlines, papers waiting, skipped steps such as
      mail or money named as skipped) and lists what would need a yes, without changing anything.
      FAIL if it changes or files anything, or reports a skipped step as empty.
