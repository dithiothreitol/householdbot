schema_version: "1.1"
name: shopping-list-dictated-add
description: shopping-list / dictated-add
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Dopisz do listy zakupów mleko i jajka.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:shopping-list|household-router)"'
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it adds milk and eggs to the household's shopping list without asking for a further confirmation
      (the member dictated them), says in a line what was added and where (for example under Lidl), and does not add
      other items on its own.
      FAIL if it asks whether to add the two items before adding them, adds items nobody asked for, or claims to
      have ordered or paid for anything.
