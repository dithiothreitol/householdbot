schema_version: "1.1"
name: annual-review-english
description: annual-review / english
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Let's do our annual review.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:annual-review)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if the reply is in English, goes through the steps in order or names them (papers that may go, policies,
      subscriptions, tax papers, closed reminders, the country pack's age, the record's health, the emergency file),
      starts with the papers (the old electricity bill may go), says which steps are skipped and why, and asks before
      any change.
      FAIL if the reply is in Polish, it claims to have changed or deleted anything, or it skips the papers step.
