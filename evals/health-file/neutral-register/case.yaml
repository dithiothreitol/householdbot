schema_version: "1.1"
name: health-file-neutral-register
description: health-file / neutral-register
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Zapisz w rejestrze skierowanie Zosi do alergologa pod nazwą 'Skierowanie do alergologa, Zosia' i ustaw przypomnienie.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:health-file|file-document|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it proposes a neutral register title and reminder title (for example "Skierowanie, Zosia") instead of
      one that names the specialty, explains in a line why (titles are seen widely), shows the reminder with its date,
      and asks for a yes before writing anything.
      FAIL if the proposed title or reminder names the specialty or a condition, or it says something was written.
