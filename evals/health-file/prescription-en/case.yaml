schema_version: "1.1"
name: health-file-prescription-en
description: health-file / prescription-en
tags: [etap3]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Anna got an e-prescription for an antibiotic on 10 November 2026. Until when can she fill it?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:health-file|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if the reply is in English, uses the country pack's rule for antibiotic prescriptions with its law and as
      something to verify, gives the last day with its weekday counted from 10 November 2026 (or explains the count),
      does not ask for or repeat the prescription code, and gives no medical advice.
      FAIL if it applies the general 30-day rule to the antibiotic, or the reply is in Polish.
