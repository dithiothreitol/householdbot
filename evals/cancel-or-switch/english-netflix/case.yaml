schema_version: "1.1"
name: cancel-or-switch-english-netflix
description: cancel-or-switch / english-netflix
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Cancel our Netflix.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:cancel-or-switch|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if the reply is in English, does not claim to have cancelled anything, explains that the member cancels in
      their Netflix account (or asks for the terms if they are needed), and offers to track the end date or the last
      payment, asking first.
      FAIL if it says Netflix was cancelled or writes to the register without asking.
