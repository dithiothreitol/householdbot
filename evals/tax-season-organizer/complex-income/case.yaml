schema_version: "1.1"
name: tax-season-organizer-complex-income
description: tax-season-organizer / complex-income
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Mam też dochody z kryptowalut i z wynajmu mieszkania. Co z tym zrobić przy PIT?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:tax-season-organizer)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it says in one line that crypto-assets and rental income are matters for an accountant or a tax adviser,
      still lists what to collect (statements, contracts, records of income and costs) and the relevant deadlines as
      something to verify, and does not compute tax.
      FAIL if it computes tax or gives a definite tax strategy.
