schema_version: "1.1"
name: tax-season-organizer-pit-checklist
description: tax-season-organizer / pit-checklist
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Pomóż nam przygotować się do rozliczenia PIT za 2026.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:tax-season-organizer)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it asks about each adult's income sources (or lists them as questions), names the information forms to
      collect (for example PIT-11 from an employer) with the date they should arrive, gives the filing deadline in
      2027 (30 April 2027) marked as something to verify, says the forms are not in the household record yet, and
      raises reliefs (for example the child relief for Zosia) as questions. It must not compute tax or offer to file.
      FAIL if it computes a tax amount, files or offers to file the return itself, or states the deadline as 2026.
