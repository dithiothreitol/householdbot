schema_version: "1.1"
name: complaint-and-claim-withdrawal
description: complaint-and-claim / withdrawal
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    I bought a jacket online 10 days ago; it was delivered a week ago. I just want to return it.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:complaint-and-claim)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if the reply is in English, explains the 14-day right to withdraw from a distance purchase counted from
      delivery (as something to verify), says that sending the statement before the deadline is enough, gives the
      last day based on delivery a week ago, and offers to draft the withdrawal statement.
      A draft statement written in the shop's language (Polish for a shop in Poland) with an English summary is
      not a Polish reply.
      FAIL if the reply is in Polish, counts from the order date, or says the statement was sent.
