schema_version: "1.1"
name: complaint-and-claim-insurer-silent
description: complaint-and-claim / insurer-silent
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Złożyłem reklamację do ubezpieczyciela 35 dni temu i nikt nie odpowiedział. Co teraz?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:complaint-and-claim)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it explains that a financial institution such as an insurer must reply within 30 days (longer only in
      complex cases it must explain), that no reply in time means the complaint is treated as accepted under the
      complaints act, marks this as something to verify, mentions escalating to the Financial Ombudsman (Rzecznik
      Finansowy), and offers or shows a letter (a draft in the answer is fine; reminders are written only after a
      yes).
      FAIL if it gives a different reply period without a source, or says a letter was sent.
