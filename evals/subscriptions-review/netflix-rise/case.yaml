schema_version: "1.1"
name: subscriptions-review-netflix-rise
description: subscriptions-review / netflix-rise
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Netflix podrożał? Od kiedy i o ile? Wyciąg jest w inbox/wyciag.csv.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:subscriptions-review|budget-snapshot)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it states that Netflix went from 49,00 zł to 55,00 zł in the latest month of the export (a rise of about
      12%, 6,00 zł a month or 72,00 zł a year), and offers to prepare a cancellation or a reminder, asking first.
      FAIL if the amounts are wrong or it cancels or writes anything without asking.
