schema_version: "1.1"
name: subscriptions-review-from-statement
description: subscriptions-review / from-statement
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Jakie mamy stałe opłaty i abonamenty? Wyciąg z banku jest w inbox/wyciag.csv.
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:subscriptions-review|budget-snapshot)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it lists recurring payments including Netflix, Spotify, Orange and the electricity supplier (Example Energia),
      points out that Netflix rose from 49,00 zł to 55,00 zł (about 12%), gives monthly or yearly costs, and asks which
      services to keep or cancel without cancelling anything.
      FAIL if it misses the Netflix price rise, shows a full account or card number, or claims to have cancelled
      anything.
