schema_version: "1.1"
name: bills-due-payment-list
description: bills-due / payment-list
tags: [etap2]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Co trzeba zapłacić w najbliższych dwóch tygodniach?
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:bills-due|deadline-tracker|household-router)"'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: result
    type: llm
    criteria: |
      The working folder holds a synthetic household record (Anna and Piotr Nowak, their daughter Zosia,
      a profile and registers); facts taken from it are not invented.
      PASS if it lists the water bill (164,20 zł, overdue), the electricity bill (286,40 zł) and the property tax
      instalment (281,00 zł), gives the total 731,60 zł, says where each account number is (the document and page)
      or that the member takes it from the original or the bank's saved payees, and asks the member to confirm the
      list. It must not mark anything as paid.
      FAIL if the total is different, an item is missing, a full bank account number is shown, or it says something
      was paid or marked as paid.
