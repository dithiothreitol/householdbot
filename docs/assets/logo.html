<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HouseholdBot logo</title>
<!--
  Source of docs/assets/logo.png and logo.pl.png (1200 x 360), shown at the top
  of README.md and README.pl.md. The card is white with a soft border, so it
  reads on light and dark pages alike; the corners are transparent. The avatar
  comes from avatar.svg next to this file.
  Render (add #pl to the file name for the Polish line):
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=1
           --default-background-color=00000000 --window-size=1200,360
           --screenshot=logo.png logo.html
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 360px; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .card {
    position: absolute; inset: 12px; border-radius: 44px; background: #ffffff;
    border: 2px solid #d3e6db; display: flex; align-items: center; gap: 44px; padding: 0 56px;
  }
  img { width: 236px; height: 236px; flex: none; border-radius: 52px; }
  h1 { font-size: 116px; line-height: 1; font-weight: 700; letter-spacing: -3px; color: #0f3527; }
  p { margin-top: 18px; font-size: 33px; font-weight: 500; color: #5b6b63; }
  p b { color: #2e7d5b; font-weight: 650; }
</style>
</head>
<body>
  <div class="card">
    <img src="avatar.svg" alt="">
    <div>
      <h1>HouseholdBot</h1>
      <p lang="en">Household paperwork, <b>handled in a conversation</b></p>
      <p lang="pl" hidden>Domowe dokumenty, <b>załatwiane w rozmowie</b></p>
    </div>
  </div>
  <script>
    if (location.hash === "#pl") {
      document.documentElement.lang = "pl";
      document.querySelector('p[lang="en"]').hidden = true;
      document.querySelector('p[lang="pl"]').hidden = false;
    }
  </script>
</body>
</html>
