name: release

# A tag vX.Y.Z (or vX.Y.Z-rc.N) builds the packages from that commit and
# publishes them as a GitHub release: householdbot.plugin (the whole plugin,
# for Cowork's Upload plugin), its SHA-256, and one zip per skill (for
# claude.ai, which takes single skills).
#
# Two jobs: the build runs every check and tool with a read-only token that is
# not kept in the checkout; only the publish job can write, and it runs no
# installed tool, it only uploads what the build produced.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import json; print(json.load(open('householdbot/.claude-plugin/plugin.json'))['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG, plugin.json $version"; exit 1; }

      - name: Unit tests and repository checks
        run: |
          python -m pip install pyyaml
          python -m unittest discover -s tests
          python scripts/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plugin and marketplace manifests (plugin directory profile)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.323
          claude plugin validate . --strict
          claude plugin validate ./householdbot --profile directory --strict

      - name: Build the packages (runs sync --check and validate.py first)
        run: python scripts/package.py --skills

      - name: Release notes (.github/release-notes/<tag>.md, else the changelog)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f ".github/release-notes/$TAG.md" ]; then
            cp ".github/release-notes/$TAG.md" dist/notes.md
          else
            python - "${TAG#v}" > dist/notes.md <<'EOF'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?" + re.escape(sys.argv[1]) + r"\]?.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "See CHANGELOG.md.")
          EOF
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$REPO" $prerelease \
            --title "HouseholdBot $version" --notes-file dist/notes.md \
            dist/householdbot.plugin dist/householdbot.plugin.sha256 dist/skills/*.zip
