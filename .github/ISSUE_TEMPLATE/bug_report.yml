name: Bug report
description: A skill gave a wrong answer or a wrong date, or did something without asking first.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **Use synthetic data only**: never paste a real document, name, address, account number or ID number. Reports in Polish are welcome too (zgłoszenie można napisać po polsku).
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill ran, for example deadline-tracker or file-document.
  - type: dropdown
    id: surface
    attributes:
      label: Where it ran
      options:
        - Claude Code (terminal or IDE)
        - Claude desktop app (Code tab)
        - Cowork
        - claude.ai
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HouseholdBot version
      placeholder: 1.0.0-rc.1
  - type: dropdown
    id: country
    attributes:
      label: Country pack
      options:
        - PL (Poland)
        - GB (England and Wales)
        - A household pack
        - None
  - type: textarea
    id: request
    attributes:
      label: What you asked
      description: The request, with synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The answer, or the part of it that is wrong. Remove anything real.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real document, name, address or identifier.
          required: true
